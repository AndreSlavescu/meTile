  <rect x="852" y="226" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <rect x="672" y="272" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <rect x="732" y="272" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <rect x="792" y="272" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <rect x="852" y="272" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <rect x="672" y="318" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <rect x="732" y="318" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <rect x="792" y="318" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <rect x="852" y="318" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <text x="788" y="392" font-size="14" font-weight="650" fill="#7357aa" text-anchor="middle">C tile</text>
  <text x="321" y="284" font-size="26" font-weight="400" fill="#536677" text-anchor="middle">×</text>
  <text x="633" y="284" font-size="26" font-weight="400" fill="#536677" text-anchor="middle">→</text>
  <text x="164" y="421" font-size="14" font-weight="400" fill="#172b3a" text-anchor="middle" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" xml:space="preserve">BM × BK</text>
  <text x="476" y="421" font-size="14" font-weight="400" fill="#172b3a" text-anchor="middle" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" xml:space="preserve">BK × BN</text>
  <text x="788" y="421" font-size="14" font-weight="400" fill="#172b3a" text-anchor="middle" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" xml:space="preserve">BM × BN</text>
  <text x="480" y="465" font-size="14" font-weight="400" fill="#536677" text-anchor="middle">Output grid = ceil(M / BM) × ceil(N / BN)</text>
  <rect x="32" y="508" width="280" height="174" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="537" font-size="14" font-weight="650" fill="#7357aa" text-anchor="start">01 / INITIALIZE</text>
  <text x="52" y="568" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Start from zero</text>
  <text x="52" y="597" font-size="14" font-weight="400" fill="#536677" text-anchor="start">One FP32 accumulator tile</text>
  <text x="52" y="619" font-size="14" font-weight="400" fill="#536677" text-anchor="start">belongs to this program.</text>
  <rect x="340" y="508" width="280" height="174" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="360" y="537" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">02 / REDUCE</text>
  <text x="360" y="568" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Accumulate across K</text>
  <text x="360" y="597" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Load the next A and B tiles.</text>
  <text x="360" y="619" font-size="14" font-weight="400" fill="#536677" text-anchor="start">acc = dot(left, right, acc)</text>
  <text x="360" y="641" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Repeat in BK-sized steps.</text>
  <rect x="648" y="508" width="280" height="174" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="668" y="537" font-size="14" font-weight="650" fill="#c17134" text-anchor="start">03 / STORE</text>
  <text x="668" y="568" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Write the result once</text>
  <text x="668" y="597" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Apply a supported epilogue.</text>
  <text x="668" y="619" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Store the completed tile</text>
  <text x="668" y="641" font-size="14" font-weight="400" fill="#536677" text-anchor="start">with output bounds checks.</text>
  <line x1="316" y1="587" x2="334" y2="587" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="624" y1="587" x2="642" y2="587" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="32" y1="734" x2="928" y2="734" stroke="#d8e3e9" stroke-width="1.5" />
  <text x="32" y="761" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Tile dimensions describe ownership, not one hardware instruction.</text>
  <text x="32" y="783" font-size="14" font-weight="400" fill="#536677" text-anchor="start">The selected backend must support the requested shape, dtype, layout, and resource use.</text>
</svg>

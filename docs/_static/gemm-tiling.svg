  <rect x="540" y="226" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="360" y="272" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="420" y="272" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="480" y="272" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="540" y="272" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="360" y="318" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="420" y="318" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="480" y="318" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="540" y="318" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <text x="476" y="392" font-size="14" font-weight="650" fill="#c17134" text-anchor="middle">B tile</text>
  <text x="672" y="156" font-size="20" font-weight="650" fill="#7357aa" text-anchor="start">C</text>
  <text x="912" y="156" font-size="14" font-weight="400" fill="#536677" text-anchor="end">M × N</text>
  <rect x="672" y="180" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <rect x="732" y="180" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />
  <rect x="792" y="180" width="56" height="42" rx="5" fill="#f3eff9" stroke="none" stroke-width="1" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 802" role="img" aria-labelledby="title description" font-family="Inter, DejaVu Sans, Arial, sans-serif">
  <title id="title">One output tile, many products along K</title>
  <desc id="description">Matching BM by BK and BK by BN tiles are loaded along the reduction dimension. Each product updates the same FP32 accumulator. After the loop, a supported epilogue may run before the completed output tile is stored. Edge tiles need bounds checks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="802" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
  <text x="32" y="46" font-size="27" font-weight="650" fill="#172b3a" text-anchor="start">One output tile, many products along K</text>
  <text x="32" y="76" font-size="14" font-weight="400" fill="#536677" text-anchor="start">C = A × B. Each program keeps an accumulator for its own BM × BN output tile.</text>
  <line x1="32" y1="100" x2="928" y2="100" stroke="#d8e3e9" stroke-width="1.5" />
  <text x="48" y="156" font-size="20" font-weight="650" fill="#087f8c" text-anchor="start">A</text>
  <text x="288" y="156" font-size="14" font-weight="400" fill="#536677" text-anchor="end">M × K</text>

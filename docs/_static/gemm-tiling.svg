  <rect x="228" y="180" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="48" y="226" width="56" height="42" rx="5" fill="#087f8c" stroke="none" stroke-width="1" />
  <rect x="108" y="226" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="168" y="226" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="228" y="226" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="48" y="272" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="108" y="272" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="168" y="272" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="228" y="272" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="48" y="318" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="108" y="318" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="168" y="318" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <rect x="228" y="318" width="56" height="42" rx="5" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="164" y="392" font-size="14" font-weight="650" fill="#087f8c" text-anchor="middle">A tile</text>
  <text x="360" y="156" font-size="20" font-weight="650" fill="#c17134" text-anchor="start">B</text>
  <text x="600" y="156" font-size="14" font-weight="400" fill="#536677" text-anchor="end">K × N</text>
  <rect x="360" y="180" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="420" y="180" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="480" y="180" width="56" height="42" rx="5" fill="#c17134" stroke="none" stroke-width="1" />
  <rect x="540" y="180" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />
  <rect x="360" y="226" width="56" height="42" rx="5" fill="#fcf2e8" stroke="none" stroke-width="1" />

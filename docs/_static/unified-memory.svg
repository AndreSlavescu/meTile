<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Unified memory on Apple Silicon</title>
  <desc id="description">A white academic diagram showing Python and NumPy on the CPU and a Metal compute kernel on the Apple GPU reading and writing the same unified physical memory through a meTile Buffer. No host-to-device copy occurs. After a GPU write, the CPU synchronizes before reading a direct NumPy view.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9Z" fill="#273142"/>
    </marker>
    <style>
      .box { stroke: #273142; stroke-width: 1.5; }
      .inner { fill: #ffffff; stroke: #526071; stroke-width: 1.2; }
      .edge { fill: none; stroke: #273142; stroke-width: 1.55; stroke-linecap: square; stroke-linejoin: miter; marker-start: url(#arrow); marker-end: url(#arrow); }
      .flow { fill: none; stroke: #273142; stroke-width: 1.55; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .title { fill: #172033; font-size: 22px; font-weight: 700; }
      .subtitle { fill: #556070; font-size: 11.5px; }
      .label { fill: #172033; font-size: 14px; font-weight: 700; }
      .body { fill: #263243; font-size: 11.5px; }
      .small { fill: #596579; font-size: 10px; }
      .tiny { fill: #596579; font-size: 9px; }
      .caps { fill: #344054; font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px; }
      .mono { fill: #263243; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 10px; }
    </style>
  </defs>

  <rect width="900" height="520" fill="#ffffff"/>

  <!-- Heading -->
  <text x="32" y="40" class="title">Unified memory on Apple Silicon</text>
  <text x="32" y="60" class="subtitle">CPU and GPU access the same physical allocation through <tspan class="mono">metile.Buffer</tspan></text>
  <line x1="32" y1="76" x2="868" y2="76" stroke="#aeb6c2" stroke-width="1"/>

  <!-- CPU client -->
  <rect x="32" y="160" width="190" height="150" rx="3" fill="#e7effa" class="box"/>
  <text x="49" y="184" class="caps">CPU</text>
  <text x="49" y="211" class="label">Python / NumPy</text>
  <rect x="49" y="228" width="156" height="30" rx="2" class="inner"/>
  <text x="61" y="248" class="mono">Buffer.from_numpy(arr)</text>
  <rect x="49" y="268" width="156" height="25" rx="2" class="inner"/>
  <text x="61" y="285" class="mono">out.numpy()</text>

  <!-- Shared allocation -->
  <rect x="286" y="126" width="328" height="218" rx="3" fill="#e3f2ec" class="box"/>
  <text x="304" y="151" class="caps">UNIFIED PHYSICAL MEMORY</text>
  <text x="304" y="180" class="label">One shared allocation</text>
  <text x="304" y="201" class="body">CPU and GPU use the same physical address.</text>
  <rect x="304" y="220" width="292" height="52" rx="2" fill="#ffffff" class="inner"/>
  <text x="320" y="242" class="mono">metile.Buffer(data=np_array)</text>
  <text x="320" y="260" class="small">existing NumPy storage, wrapped without a transfer</text>
  <rect x="304" y="289" width="292" height="35" rx="2" fill="#fff4cf" class="inner"/>
  <text x="320" y="311" class="label">No host ↔ device copy</text>

  <!-- GPU client -->
  <rect x="678" y="160" width="190" height="150" rx="3" fill="#ece5f6" class="box"/>
  <text x="695" y="184" class="caps">APPLE GPU</text>
  <text x="695" y="211" class="label">Metal compute kernel</text>
  <rect x="695" y="228" width="156" height="30" rx="2" class="inner"/>
  <text x="707" y="248" class="mono">device T* buffer</text>
  <rect x="695" y="268" width="156" height="25" rx="2" class="inner"/>
  <text x="707" y="285" class="mono">load / store</text>

  <!-- Bidirectional shared-memory access -->
  <path d="M224 235H284" class="edge"/>
  <rect x="223" y="218" width="62" height="15" fill="#ffffff"/>
  <text x="255" y="229" text-anchor="middle" class="tiny">read / write</text>
  <path d="M616 235H676" class="edge"/>
  <rect x="615" y="218" width="62" height="15" fill="#ffffff"/>
  <text x="647" y="229" text-anchor="middle" class="tiny">read / write</text>

  <!-- Synchronization sequence -->
  <text x="32" y="391" class="caps">AFTER A GPU WRITE</text>
  <rect x="32" y="408" width="238" height="58" rx="3" fill="#ece5f6" class="box"/>
  <text x="49" y="431" class="label">1 · Kernel updates buffer</text>
  <text x="49" y="450" class="small">Metal stores into unified memory</text>

  <path d="M270 437H326" class="flow"/>
  <rect x="328" y="408" width="238" height="58" rx="3" fill="#fff4cf" class="box"/>
  <text x="345" y="431" class="label">2 · Synchronize</text>
  <text x="345" y="450" class="mono">MetalDevice.get().sync()</text>

  <path d="M566 437H622" class="flow"/>
  <rect x="624" y="408" width="244" height="58" rx="3" fill="#e7effa" class="box"/>
  <text x="641" y="431" class="label">3 · Read direct view</text>
  <text x="641" y="450" class="mono">result = out.numpy()</text>

  <line x1="32" y1="493" x2="868" y2="493" stroke="#d0d5dd" stroke-width="1"/>
  <text x="32" y="510" class="tiny">Synchronization orders access; it does not copy the allocation.</text>
  <text x="868" y="510" text-anchor="end" class="tiny"><tspan class="mono">metile.shared</tspan> is separate threadgroup-local storage.</text>
</svg>

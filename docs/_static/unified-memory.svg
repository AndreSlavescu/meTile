<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 652" role="img" aria-labelledby="title description" font-family="Inter, DejaVu Sans, Arial, sans-serif">
  <title id="title">Shared memory, explicit synchronization</title>
  <desc id="description">Buffer(data=array) copies the input into shared Metal storage. CPU and GPU then access that allocation. After GPU writes, Buffer.numpy() waits for completion and returns a direct NumPy view. metile.shared is separate threadgroup-local storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="652" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
  <text x="32" y="46" font-size="27" font-weight="650" fill="#172b3a" text-anchor="start">Shared memory, explicit synchronization</text>
  <text x="32" y="76" font-size="14" font-weight="400" fill="#536677" text-anchor="start">On Apple silicon, the CPU and GPU can access the same Metal buffer allocation.</text>
  <line x1="32" y1="100" x2="928" y2="100" stroke="#d8e3e9" stroke-width="1.5" />
  <rect x="32" y="140" width="240" height="170" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="169" font-size="14" font-weight="650" fill="#3267a8" text-anchor="start">CPU</text>
  <text x="52" y="200" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Python / NumPy</text>
  <text x="52" y="229" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Create a Buffer.</text>
  <text x="52" y="251" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Read or write its view.</text>
  <rect x="328" y="140" width="304" height="170" rx="12" fill="#e8f5f4" stroke="#d8e3e9" stroke-width="1" />
  <text x="348" y="169" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">SHARED ALLOCATION</text>
  <text x="348" y="200" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Metal buffer storage</text>
  <text x="348" y="229" font-size="14" font-weight="400" fill="#536677" text-anchor="start">CPU and GPU access</text>
  <text x="348" y="251" font-size="14" font-weight="400" fill="#536677" text-anchor="start">the same physical allocation.</text>
  <rect x="688" y="140" width="240" height="170" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="708" y="169" font-size="14" font-weight="650" fill="#7357aa" text-anchor="start">APPLE GPU</text>
  <text x="708" y="200" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">A Metal kernel</text>
  <text x="708" y="229" font-size="14" font-weight="400" fill="#536677" text-anchor="start">device pointers</text>
  <text x="708" y="251" font-size="14" font-weight="400" fill="#536677" text-anchor="start">load / store</text>
  <line x1="282" y1="225" x2="318" y2="225" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <line x1="642" y1="225" x2="678" y2="225" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="480" y="346" font-size="14" font-weight="400" fill="#536677" text-anchor="middle">Buffer(data=array) copies input; later views share the buffer storage.</text>
  <rect x="32" y="402" width="280" height="142" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="431" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">01 / WRITE</text>
  <text x="52" y="462" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Update the buffer</text>
  <text x="52" y="491" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Metal stores the output.</text>
  <rect x="340" y="402" width="280" height="142" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="360" y="431" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">02 / WAIT</text>
  <text x="360" y="462" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Wait for completion</text>
  <text x="360" y="491" font-size="14" font-weight="400" fill="#536677" text-anchor="start">numpy() synchronizes first.</text>
  <rect x="648" y="402" width="280" height="142" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="668" y="431" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">03 / VIEW</text>
  <text x="668" y="462" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Read the shared result</text>
  <text x="668" y="491" font-size="14" font-weight="400" fill="#536677" text-anchor="start">result = output.numpy()</text>
  <line x1="316" y1="475" x2="334" y2="475" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="624" y1="475" x2="642" y2="475" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="32" y1="584" x2="928" y2="584" stroke="#d8e3e9" stroke-width="1.5" />
  <text x="32" y="611" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Keep the Buffer alive while using its NumPy view.</text>
  <text x="32" y="633" font-size="14" font-weight="400" fill="#536677" text-anchor="start">metile.shared is threadgroup-local storage, not the host-visible shared allocation.</text>
</svg>

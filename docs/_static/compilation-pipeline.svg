<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 926" role="img" aria-labelledby="title description" font-family="Inter, DejaVu Sans, Arial, sans-serif">
  <title id="title">From Python to an Apple GPU kernel</title>
  <desc id="description">A typed compute graph or a Python kernel enters planning and lowering. Graph discovery checks supported reduction laws; fusion uses exact min-cut for bipartite conflicts and greedy selection otherwise. Tile IR lowers to Metal IR, then MSL and Apple's compiler. Native dispatch and optional measured MLX selection are distinct runtime paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="926" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
  <text x="32" y="46" font-size="27" font-weight="650" fill="#172b3a" text-anchor="start">From Python to an Apple GPU kernel</text>
  <text x="32" y="76" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Two entry points share the compiler; MLX adds its own validation and selection gates.</text>
  <line x1="32" y1="100" x2="928" y2="100" stroke="#d8e3e9" stroke-width="1.5" />
  <rect x="32" y="124" width="432" height="134" rx="12" fill="#eef3fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="153" font-size="14" font-weight="650" fill="#3267a8" text-anchor="start">GRAPH FRONTEND</text>
  <text x="52" y="184" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">A typed compute graph</text>
  <text x="52" y="213" font-size="14" font-weight="400" fill="#536677" text-anchor="start">GraphBuilder or a supported integration.</text>
  <text x="52" y="235" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Shapes, dtypes, uses, and state stay explicit.</text>
  <rect x="496" y="124" width="432" height="134" rx="12" fill="#e8f5f4" stroke="#d8e3e9" stroke-width="1" />
  <text x="516" y="153" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">KERNEL FRONTEND</text>
  <text x="516" y="184" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">A Python tile program</text>
  <text x="516" y="213" font-size="14" font-weight="400" fill="#536677" text-anchor="start">@metile.kernel with top-level tensor views.</text>
  <text x="516" y="235" font-size="14" font-weight="400" fill="#536677" text-anchor="start">constexpr values specialize the program.</text>
  <line x1="248" y1="264" x2="248" y2="286" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="712" y1="264" x2="712" y2="286" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="32" y="294" width="432" height="174" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="323" font-size="14" font-weight="650" fill="#3267a8" text-anchor="start">MATCH + FUSE</text>
  <text x="52" y="354" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Choose legal graph regions</text>
  <text x="52" y="383" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Recognize private attention subgraphs.</text>
  <text x="52" y="405" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Check the online-reduction certificate.</text>
  <text x="52" y="427" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Use min-cut for bipartite conflicts;</text>
  <text x="52" y="449" font-size="14" font-weight="400" fill="#536677" text-anchor="start">use deterministic greedy selection otherwise.</text>
  <rect x="496" y="294" width="432" height="174" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="516" y="323" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">TRACE</text>
  <text x="516" y="354" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Build Tile IR</text>
  <text x="516" y="383" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Record loads, stores, dot, and reductions.</text>
  <text x="516" y="405" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Keep loops, masks, layouts, and precision.</text>
  <text x="516" y="427" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Pointwise GEMM epilogues are expressions,</text>
  <text x="516" y="449" font-size="14" font-weight="400" fill="#536677" text-anchor="start">not whole-kernel activation templates.</text>
  <path d="M248 468V490H172V508" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M712 468V490H172" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" />
  <rect x="32" y="516" width="280" height="168" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="545" font-size="14" font-weight="650" fill="#3267a8" text-anchor="start">01 / PLAN</text>
  <text x="52" y="576" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Plan the schedule</text>
  <text x="52" y="605" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Use declared tile sizes.</text>
  <text x="52" y="627" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Choose backend and geometry.</text>
  <text x="52" y="649" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Check schedule requirements.</text>
  <rect x="340" y="516" width="280" height="168" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="360" y="545" font-size="14" font-weight="650" fill="#7357aa" text-anchor="start">02 / LOWER</text>
  <text x="360" y="576" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Build and optimize IR</text>
  <text x="360" y="605" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Lower to Metal IR.</text>
  <text x="360" y="627" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Fold, vectorize, and stage.</text>
  <text x="360" y="649" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Make sync and MMA explicit.</text>
  <rect x="648" y="516" width="280" height="168" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="668" y="545" font-size="14" font-weight="650" fill="#c17134" text-anchor="start">03 / COMPILE</text>
  <text x="668" y="576" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">MSL → Metal toolchain</text>
  <text x="668" y="605" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Emit MSL from Metal IR.</text>
  <text x="668" y="627" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Compile offline when supported;</text>
  <text x="668" y="649" font-size="14" font-weight="400" fill="#536677" text-anchor="start">use a supported JIT fallback.</text>
  <line x1="316" y1="594" x2="334" y2="594" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="624" y1="594" x2="642" y2="594" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M788 684V706H248V728" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M788 706H712V728" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="32" y="736" width="432" height="128" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="765" font-size="14" font-weight="650" fill="#7357aa" text-anchor="start">NATIVE RUNTIME</text>
  <text x="52" y="796" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Dispatch the compiled pipeline</text>
  <text x="52" y="825" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Bind buffers and check pipeline limits.</text>
  <text x="52" y="847" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Custom kernels need their own numerical tests.</text>
  <rect x="496" y="736" width="432" height="128" rx="12" fill="#e8f5f4" stroke="#d8e3e9" stroke-width="1" />
  <text x="516" y="765" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">OPTIONAL MLX INTEGRATION</text>
  <text x="516" y="796" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Validate, measure, then choose</text>
  <text x="516" y="825" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Race valid candidates against native MLX.</text>
  <text x="516" y="847" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Keep the native path when a candidate fails.</text>
  <line x1="32" y1="878" x2="928" y2="878" stroke="#d8e3e9" stroke-width="1.5" />
  <text x="32" y="905" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Apple's compiler emits device code. Neither a schedule nor a symbolic proof establishes a speedup.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">Simdgroup layout for a 128 by 128 output tile</title>
  <desc id="description">A four by four grid maps sixteen simdgroups onto a 128 by 128 output tile. Each simdgroup contains thirty-two threads and computes one independent 32 by 32 subtile.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20242b; }
      .heading { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #505866; }
      .axis { font-size: 11px; font-weight: 700; letter-spacing: 0.7px; fill: #505866; }
      .cell-title { font-size: 14px; font-weight: 700; }
      .cell-body { font-size: 11px; fill: #4b5563; }
      .label { font-size: 13px; font-weight: 700; }
      .body { font-size: 12px; fill: #4b5563; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 12px; }
      .outline { stroke: #282d35; stroke-width: 1.4; }
      .grid-line { stroke: #657080; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="40" y="48" class="heading">Simdgroup layout</text>
  <text x="40" y="70" class="subtitle">WM = 4 · WN = 4 · one 128 × 128 output tile · sixteen independent 32 × 32 subtiles</text>
  <line x1="40" y1="88" x2="960" y2="88" stroke="#b4bcc7" stroke-width="1"/>

  <text x="140" y="119" class="axis">OUTPUT COLUMNS</text>
  <text x="215" y="145" text-anchor="middle" class="body">0–31</text>
  <text x="395" y="145" text-anchor="middle" class="body">32–63</text>
  <text x="575" y="145" text-anchor="middle" class="body">64–95</text>
  <text x="755" y="145" text-anchor="middle" class="body">96–127</text>

  <text x="53" y="176" class="axis">OUTPUT</text>
  <text x="53" y="192" class="axis">ROWS</text>
  <text x="118" y="211" text-anchor="end" class="body">0–31</text>
  <text x="118" y="291" text-anchor="end" class="body">32–63</text>
  <text x="118" y="371" text-anchor="end" class="body">64–95</text>
  <text x="118" y="451" text-anchor="end" class="body">96–127</text>

  <rect x="140" y="160" width="720" height="320" fill="#f8fafc" class="outline"/>

  <g id="simdgroup-row-0">
    <rect x="140" y="160" width="180" height="80" fill="#dcecf8" class="grid-line"/>
    <rect x="320" y="160" width="180" height="80" fill="#e7e0f2" class="grid-line"/>
    <rect x="500" y="160" width="180" height="80" fill="#dcecf8" class="grid-line"/>
    <rect x="680" y="160" width="180" height="80" fill="#e7e0f2" class="grid-line"/>
    <text x="230" y="194" text-anchor="middle" class="cell-title">sg(0,0)</text>
    <text x="230" y="216" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="410" y="194" text-anchor="middle" class="cell-title">sg(0,1)</text>
    <text x="410" y="216" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="590" y="194" text-anchor="middle" class="cell-title">sg(0,2)</text>
    <text x="590" y="216" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="770" y="194" text-anchor="middle" class="cell-title">sg(0,3)</text>
    <text x="770" y="216" text-anchor="middle" class="cell-body">32 × 32</text>
  </g>

  <g id="simdgroup-row-1">
    <rect x="140" y="240" width="180" height="80" fill="#e1f0df" class="grid-line"/>
    <rect x="320" y="240" width="180" height="80" fill="#f7ebbd" class="grid-line"/>
    <rect x="500" y="240" width="180" height="80" fill="#e1f0df" class="grid-line"/>
    <rect x="680" y="240" width="180" height="80" fill="#f7ebbd" class="grid-line"/>
    <text x="230" y="274" text-anchor="middle" class="cell-title">sg(1,0)</text>
    <text x="230" y="296" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="410" y="274" text-anchor="middle" class="cell-title">sg(1,1)</text>
    <text x="410" y="296" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="590" y="274" text-anchor="middle" class="cell-title">sg(1,2)</text>
    <text x="590" y="296" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="770" y="274" text-anchor="middle" class="cell-title">sg(1,3)</text>
    <text x="770" y="296" text-anchor="middle" class="cell-body">32 × 32</text>
  </g>

  <g id="simdgroup-row-2">
    <rect x="140" y="320" width="180" height="80" fill="#dcecf8" class="grid-line"/>
    <rect x="320" y="320" width="180" height="80" fill="#e7e0f2" class="grid-line"/>
    <rect x="500" y="320" width="180" height="80" fill="#dcecf8" class="grid-line"/>
    <rect x="680" y="320" width="180" height="80" fill="#e7e0f2" class="grid-line"/>
    <text x="230" y="354" text-anchor="middle" class="cell-title">sg(2,0)</text>
    <text x="230" y="376" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="410" y="354" text-anchor="middle" class="cell-title">sg(2,1)</text>
    <text x="410" y="376" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="590" y="354" text-anchor="middle" class="cell-title">sg(2,2)</text>
    <text x="590" y="376" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="770" y="354" text-anchor="middle" class="cell-title">sg(2,3)</text>
    <text x="770" y="376" text-anchor="middle" class="cell-body">32 × 32</text>
  </g>

  <g id="simdgroup-row-3">
    <rect x="140" y="400" width="180" height="80" fill="#e1f0df" class="grid-line"/>
    <rect x="320" y="400" width="180" height="80" fill="#f7ebbd" class="grid-line"/>
    <rect x="500" y="400" width="180" height="80" fill="#e1f0df" class="grid-line"/>
    <rect x="680" y="400" width="180" height="80" fill="#f7ebbd" class="grid-line"/>
    <text x="230" y="434" text-anchor="middle" class="cell-title">sg(3,0)</text>
    <text x="230" y="456" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="410" y="434" text-anchor="middle" class="cell-title">sg(3,1)</text>
    <text x="410" y="456" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="590" y="434" text-anchor="middle" class="cell-title">sg(3,2)</text>
    <text x="590" y="456" text-anchor="middle" class="cell-body">32 × 32</text>
    <text x="770" y="434" text-anchor="middle" class="cell-title">sg(3,3)</text>
    <text x="770" y="456" text-anchor="middle" class="cell-body">32 × 32</text>
  </g>

  <rect x="140" y="512" width="720" height="70" rx="4" fill="#f4f5f7" class="outline"/>
  <text x="158" y="539" class="label">Hardware mapping</text>
  <text x="158" y="562" class="body">Each simdgroup has 32 threads and owns one subtile independently.</text>
  <text x="842" y="550" text-anchor="end" class="mono">sg_row = sgid / WN</text>
  <text x="842" y="570" text-anchor="end" class="mono">sg_col = sgid % WN</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" role="img" aria-labelledby="title description">
  <title id="title">meTile speedup relative to native MLX</title>
  <desc id="description">A dot plot compares decode throughput speedup and end-to-end generation speedup for each model. The vertical reference line at one indicates parity with native MLX.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20242b; }
      .heading { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #505866; }
      .model { font-size: 15px; font-weight: 700; }
      .detail { font-size: 11px; fill: #596273; }
      .label { font-size: 12px; font-weight: 700; }
      .value { font-size: 11px; fill: #384252; }
      .axis { font-size: 10px; fill: #667085; }
      .footer { font-size: 10px; fill: #667085; }
    </style>
  </defs>
  <rect width="1200" height="574" fill="#ffffff"/>
  <text x="40" y="48" class="heading">meTile speedup relative to native MLX</text>
  <text x="40" y="70" class="subtitle">128-token prompt · 256 generated · median of 5 alternating trials · native MLX = 1.000&#215;</text>
  <line x1="40" y1="88" x2="1160" y2="88" stroke="#b4bcc7" stroke-width="1"/>
  <line x1="275.00" y1="116" x2="275.00" y2="510" stroke="#e0e4ea" stroke-width="1"/>
  <text x="275.00" y="108" text-anchor="middle" class="axis">0.95&#215;</text>
  <line x1="505.00" y1="116" x2="505.00" y2="510" stroke="#5b6574" stroke-width="1.6"/>
  <text x="505.00" y="108" text-anchor="middle" class="axis">1.00&#215;</text>
  <line x1="735.00" y1="116" x2="735.00" y2="510" stroke="#e0e4ea" stroke-width="1"/>
  <text x="735.00" y="108" text-anchor="middle" class="axis">1.05&#215;</text>
  <line x1="965.00" y1="116" x2="965.00" y2="510" stroke="#e0e4ea" stroke-width="1"/>
  <text x="965.00" y="108" text-anchor="middle" class="axis">1.10&#215;</text>
  <text x="40" y="162" class="model">Llama 3.2 1B</text>
  <text x="40" y="181" class="detail">16 layers · hidden 2048 · 4-bit</text>

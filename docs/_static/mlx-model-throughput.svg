<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" role="img" aria-labelledby="title description">
  <title id="title">MLX-LM decode throughput across models</title>
  <desc id="description">Paired horizontal bars compare native MLX and MLX with the guarded meTile backend across four locally cached 4-bit language models.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20242b; }
      .heading { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #505866; }
      .model { font-size: 15px; font-weight: 700; }
      .detail { font-size: 11px; fill: #596273; }
      .label { font-size: 12px; font-weight: 700; }
      .value { font-size: 11px; fill: #384252; }
      .axis { font-size: 10px; fill: #667085; }
      .footer { font-size: 10px; fill: #667085; }
    </style>
  </defs>
  <rect width="1200" height="654" fill="#ffffff"/>
  <text x="40" y="48" class="heading">MLX-LM decode throughput across models</text>
  <text x="40" y="70" class="subtitle">128-token prompt · 256 generated · median of 5 alternating trials</text>
  <line x1="40" y1="88" x2="1160" y2="88" stroke="#b4bcc7" stroke-width="1"/>
  <line x1="275.0" y1="112" x2="275.0" y2="592" stroke="#e0e4ea" stroke-width="1"/>
  <text x="275.0" y="108" text-anchor="middle" class="axis">0</text>
  <line x1="457.5" y1="112" x2="457.5" y2="592" stroke="#e0e4ea" stroke-width="1"/>
  <text x="457.5" y="108" text-anchor="middle" class="axis">81</text>
  <line x1="640.0" y1="112" x2="640.0" y2="592" stroke="#e0e4ea" stroke-width="1"/>
  <text x="640.0" y="108" text-anchor="middle" class="axis">162</text>
  <line x1="822.5" y1="112" x2="822.5" y2="592" stroke="#e0e4ea" stroke-width="1"/>
  <text x="822.5" y="108" text-anchor="middle" class="axis">244</text>
  <line x1="1005.0" y1="112" x2="1005.0" y2="592" stroke="#e0e4ea" stroke-width="1"/>
  <text x="1005.0" y="108" text-anchor="middle" class="axis">325</text>
  <text x="640.0" y="126" text-anchor="middle" class="axis">median decode tokens / second</text>
  <text x="40" y="166" class="model">Llama 3.2 1B</text>
  <text x="40" y="185" class="detail">16 layers · hidden 2048 · 4-bit</text>
  <text x="260" y="170" text-anchor="end" class="label">MLX</text>
  <rect x="275" y="154" width="342.19" height="24" rx="2" fill="#dcecf8" stroke="#526071" stroke-width="1"/>
  <text x="626.19" y="170" class="value">152.34</text>
  <text x="260" y="207" text-anchor="end" class="label">MLX + meTile</text>
  <rect x="275" y="191" width="341.95" height="24" rx="2" fill="#dcefdc" stroke="#526071" stroke-width="1"/>
  <text x="625.95" y="207" class="value">152.24</text>
  <text x="1140" y="189" text-anchor="end" class="label">0.999&#215; decode</text>
  <line x1="40" y1="236" x2="1160" y2="236" stroke="#edf0f3" stroke-width="1"/>
  <text x="40" y="282" class="model">Llama 3.2 3B</text>
  <text x="40" y="301" class="detail">28 layers · hidden 3072 · 4-bit</text>
  <text x="260" y="286" text-anchor="end" class="label">MLX</text>
  <rect x="275" y="270" width="133.02" height="24" rx="2" fill="#dcecf8" stroke="#526071" stroke-width="1"/>
  <text x="417.02" y="286" class="value">59.22</text>
  <text x="260" y="323" text-anchor="end" class="label">MLX + meTile</text>
  <rect x="275" y="307" width="138.27" height="24" rx="2" fill="#dcefdc" stroke="#526071" stroke-width="1"/>
  <text x="422.27" y="323" class="value">61.56</text>
  <text x="1140" y="305" text-anchor="end" class="label">1.039&#215; decode</text>
  <line x1="40" y1="352" x2="1160" y2="352" stroke="#edf0f3" stroke-width="1"/>
  <text x="40" y="398" class="model">Qwen 2.5 0.5B</text>
  <text x="40" y="417" class="detail">24 layers · hidden 896 · 4-bit</text>
  <text x="260" y="402" text-anchor="end" class="label">MLX</text>
  <rect x="275" y="386" width="693.57" height="24" rx="2" fill="#dcecf8" stroke="#526071" stroke-width="1"/>
  <text x="977.57" y="402" class="value">308.78</text>
  <text x="260" y="439" text-anchor="end" class="label">MLX + meTile</text>
  <rect x="275" y="423" width="690.12" height="24" rx="2" fill="#dcefdc" stroke="#526071" stroke-width="1"/>
  <text x="974.12" y="439" class="value">307.25</text>
  <text x="1140" y="421" text-anchor="end" class="label">0.995&#215; decode</text>
  <line x1="40" y1="468" x2="1160" y2="468" stroke="#edf0f3" stroke-width="1"/>
  <text x="40" y="514" class="model">Qwen 2.5 1.5B</text>
  <text x="40" y="533" class="detail">28 layers · hidden 1536 · 4-bit</text>
  <text x="260" y="518" text-anchor="end" class="label">MLX</text>
  <rect x="275" y="502" width="264.94" height="24" rx="2" fill="#dcecf8" stroke="#526071" stroke-width="1"/>
  <text x="548.94" y="518" class="value">117.95</text>
  <text x="260" y="555" text-anchor="end" class="label">MLX + meTile</text>
  <rect x="275" y="539" width="261.34" height="24" rx="2" fill="#dcefdc" stroke="#526071" stroke-width="1"/>
  <text x="545.34" y="555" class="value">116.35</text>
  <text x="1140" y="537" text-anchor="end" class="label">0.986&#215; decode</text>
  <line x1="40" y1="584" x2="1160" y2="584" stroke="#edf0f3" stroke-width="1"/>
  <rect x="40" y="611" width="12" height="12" fill="#dcecf8" stroke="#526071"/>
  <text x="60" y="621" class="footer">native MLX</text>
  <rect x="142" y="611" width="12" height="12" fill="#dcefdc" stroke="#526071"/>
  <text x="162" y="621" class="footer">MLX + guarded meTile</text>
  <text x="1160" y="621" text-anchor="end" class="footer">Apple M5 · 32 GB · MLX 0.32.0 · MLX-LM 0.31.3 · seed 0 · rev b287320 · 2026-07-18</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 968" role="img" aria-labelledby="title description" font-family="Inter, DejaVu Sans, Arial, sans-serif">
  <title id="title">Recognize a graph. Check the reduction law.</title>
  <desc id="description">Attention recognition checks exact shapes, dtypes, axes and private intermediates. The weighted online-softmax summary is maximum, normalizer and numerator. A restricted symbolic checker verifies lifted identity, generated three-token associativity and two-token summary homomorphism. Passing produces a certificate and an atomic rewrite; failing preserves the original DAG. Symbolic real-arithmetic identities do not imply bitwise floating-point equivalence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="968" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
  <text x="32" y="46" font-size="27" font-weight="650" fill="#172b3a" text-anchor="start">Recognize a graph. Check the reduction law.</text>
  <text x="32" y="76" font-size="14" font-weight="400" fill="#536677" text-anchor="start">A certified rewrite is conditional; a failed match or obligation leaves the original graph intact.</text>
  <line x1="32" y1="100" x2="928" y2="100" stroke="#d8e3e9" stroke-width="1.5" />
  <rect x="32" y="126" width="432" height="294" rx="12" fill="#eef3fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="155" font-size="14" font-weight="650" fill="#3267a8" text-anchor="start">01 / MATCH</text>
  <text x="52" y="186" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Find an exact, private region</text>
  <text x="52" y="215" font-size="14" font-weight="400" fill="#536677" text-anchor="start">QKᵀ → scale → optional causal mask</text>
  <text x="52" y="237" font-size="14" font-weight="400" fill="#536677" text-anchor="start">→ softmax over the key axis → PV</text>
  <text x="52" y="259" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Check shape, dtype, axis, and use counts.</text>
  <text x="52" y="281" font-size="14" font-weight="400" fill="#536677" text-anchor="start">An intermediate with another user escapes</text>
  <text x="52" y="303" font-size="14" font-weight="400" fill="#536677" text-anchor="start">the region and prevents this rewrite.</text>
  <rect x="496" y="126" width="432" height="294" rx="12" fill="#f3eff9" stroke="#d8e3e9" stroke-width="1" />
  <text x="516" y="155" font-size="14" font-weight="650" fill="#7357aa" text-anchor="start">02 / SUMMARIZE</text>
  <text x="516" y="186" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Use a finite online state</text>
  <text x="516" y="218" font-size="15" font-weight="400" fill="#172b3a" text-anchor="start">Σ = (m, ℓ, o)     lift(s, v) = (s, 1, v)</text>
  <text x="516" y="249" font-size="15" font-weight="400" fill="#172b3a" text-anchor="start">m = max(mₐ, mᵦ)</text>
  <text x="516" y="280" font-size="15" font-weight="400" fill="#172b3a" text-anchor="start">α = exp(mₐ − m),  β = exp(mᵦ − m)</text>
  <text x="516" y="311" font-size="15" font-weight="400" fill="#172b3a" text-anchor="start">ℓ = αℓₐ + βℓᵦ</text>
  <text x="516" y="342" font-size="15" font-weight="400" fill="#172b3a" text-anchor="start">o = αoₐ + βoᵦ</text>
  <text x="516" y="373" font-size="15" font-weight="400" fill="#172b3a" text-anchor="start">finalize(Σ) = o / ℓ</text>
  <line x1="468" y1="266" x2="490" y2="266" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M712 420V446H480V466" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="32" y="474" width="896" height="226" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="504" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">03 / CHECK THE OBLIGATIONS</text>
  <text x="52" y="549" font-size="17" font-weight="650" fill="#172b3a" text-anchor="start">Lifted identity</text>
  <text x="52" y="585" font-size="16" font-weight="400" fill="#172b3a" text-anchor="start">identity ⊗ A = A</text>
  <text x="52" y="612" font-size="16" font-weight="400" fill="#172b3a" text-anchor="start">A ⊗ identity = A</text>
  <text x="344" y="549" font-size="17" font-weight="650" fill="#172b3a" text-anchor="start">Generated associativity</text>
  <text x="344" y="585" font-size="16" font-weight="400" fill="#172b3a" text-anchor="start">(A ⊗ B) ⊗ C</text>
  <text x="344" y="612" font-size="16" font-weight="400" fill="#172b3a" text-anchor="start">= A ⊗ (B ⊗ C)</text>
  <text x="638" y="549" font-size="17" font-weight="650" fill="#172b3a" text-anchor="start">Pair homomorphism</text>
  <text x="638" y="585" font-size="16" font-weight="400" fill="#172b3a" text-anchor="start">h([a, b])</text>
  <text x="638" y="612" font-size="16" font-weight="400" fill="#172b3a" text-anchor="start">= A ⊗ B</text>
  <line x1="52" y1="630" x2="908" y2="630" stroke="#d8e3e9" stroke-width="1.5" />
  <text x="52" y="652" font-size="14" font-weight="400" fill="#536677" text-anchor="start">A, B, C are lifted token states; h([a, b]) is the direct two-token summary.</text>
  <text x="52" y="679" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Restricted theory: commutative semiring, max monoid, and exp(x + y) = exp(x) exp(y).</text>
  <path d="M480 700V724H248V732" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M480 724H712V732" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" />
  <text x="248" y="752" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">All obligations pass</text>
  <text x="712" y="752" font-size="14" font-weight="400" fill="#c17134" text-anchor="middle">A match or obligation fails</text>
  <line x1="248" y1="758" x2="248" y2="766" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="712" y1="758" x2="712" y2="766" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="32" y="774" width="432" height="120" rx="12" fill="#e8f5f4" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="803" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">REWRITE</text>
  <text x="52" y="834" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Attach the certificate</text>
  <text x="52" y="863" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Replace the region atomically with flash_attention.</text>
  <rect x="496" y="774" width="432" height="120" rx="12" fill="#fcf2e8" stroke="#d8e3e9" stroke-width="1" />
  <text x="516" y="803" font-size="14" font-weight="650" fill="#c17134" text-anchor="start">KEEP</text>
  <text x="516" y="834" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Preserve the original DAG</text>
  <text x="516" y="863" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Do not emit a speculative algorithm replacement.</text>
  <line x1="32" y1="920" x2="928" y2="920" stroke="#d8e3e9" stroke-width="1.5" />
  <text x="32" y="947" font-size="14" font-weight="400" fill="#536677" text-anchor="start">These checks concern symbolic real arithmetic. Validate floating-point results separately.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" role="img" aria-labelledby="title description" font-family="Inter, DejaVu Sans, Arial, sans-serif">
  <title id="title">Partition the output. Reuse the tile program.</title>
  <desc id="description">A two-dimensional launch grid assigns one output tile to each program. The program initializes an accumulator, loads paired A and B tiles along K, accumulates dot products, and stores once. The compiler selects a supported matrix backend.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="688" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
  <text x="32" y="46" font-size="27" font-weight="650" fill="#172b3a" text-anchor="start">Partition the output. Reuse the tile program.</text>
  <text x="32" y="76" font-size="14" font-weight="400" fill="#536677" text-anchor="start">program_id chooses an output block; the reduction over K stays inside that program.</text>
  <line x1="32" y1="100" x2="928" y2="100" stroke="#d8e3e9" stroke-width="1.5" />
  <rect x="32" y="126" width="368" height="378" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="155" font-size="14" font-weight="650" fill="#3267a8" text-anchor="start">01 / PARTITION C</text>
  <text x="52" y="186" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">One program per output tile</text>
  <rect x="56" y="218" width="100" height="62" rx="6" fill="#3267a8" stroke="none" stroke-width="1" />
  <text x="106" y="255" font-size="14" font-weight="400" fill="#ffffff" text-anchor="middle">pid (0, 0)</text>
  <rect x="164" y="218" width="100" height="62" rx="6" fill="#eef3fb" stroke="none" stroke-width="1" />
  <text x="214" y="255" font-size="14" font-weight="400" fill="#3267a8" text-anchor="middle">pid (0, 1)</text>
  <rect x="272" y="218" width="100" height="62" rx="6" fill="#eef3fb" stroke="none" stroke-width="1" />
  <text x="322" y="255" font-size="14" font-weight="400" fill="#3267a8" text-anchor="middle">…</text>
  <rect x="56" y="288" width="100" height="62" rx="6" fill="#eef3fb" stroke="none" stroke-width="1" />
  <text x="106" y="325" font-size="14" font-weight="400" fill="#3267a8" text-anchor="middle">pid (1, 0)</text>
  <rect x="164" y="288" width="100" height="62" rx="6" fill="#eef3fb" stroke="none" stroke-width="1" />
  <text x="214" y="325" font-size="14" font-weight="400" fill="#3267a8" text-anchor="middle">pid (1, 1)</text>
  <rect x="272" y="288" width="100" height="62" rx="6" fill="#eef3fb" stroke="none" stroke-width="1" />
  <text x="322" y="325" font-size="14" font-weight="400" fill="#3267a8" text-anchor="middle">…</text>
  <rect x="56" y="358" width="100" height="62" rx="6" fill="#eef3fb" stroke="none" stroke-width="1" />
  <text x="106" y="395" font-size="14" font-weight="400" fill="#3267a8" text-anchor="middle">…</text>
  <rect x="164" y="358" width="100" height="62" rx="6" fill="#eef3fb" stroke="none" stroke-width="1" />
  <text x="214" y="395" font-size="14" font-weight="400" fill="#3267a8" text-anchor="middle">…</text>
  <rect x="272" y="358" width="100" height="62" rx="6" fill="#eef3fb" stroke="none" stroke-width="1" />
  <text x="322" y="395" font-size="14" font-weight="400" fill="#3267a8" text-anchor="middle">…</text>
  <text x="56" y="465" font-size="14" font-weight="400" fill="#172b3a" text-anchor="start" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" xml:space="preserve">Tile shape: BM × BN</text>
  <text x="56" y="488" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Mask partial tiles at the edges.</text>
  <rect x="448" y="126" width="480" height="378" rx="12" fill="#e8f5f4" stroke="#d8e3e9" stroke-width="1" />
  <text x="468" y="155" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">02 / EXECUTE</text>
  <text x="468" y="186" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">The same reduction for every tile</text>
  <text x="470" y="232" font-size="14" font-weight="400" fill="#172b3a" text-anchor="start" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" xml:space="preserve">acc = zeros((BM, BN), dtype='f32')</text>
  <text x="470" y="267" font-size="14" font-weight="400" fill="#172b3a" text-anchor="start" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" xml:space="preserve">for offset in tile_range(0, K, BK):</text>
  <text x="470" y="302" font-size="14" font-weight="400" fill="#172b3a" text-anchor="start" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" xml:space="preserve">    left = A.load((row, offset))</text>
  <text x="470" y="337" font-size="14" font-weight="400" fill="#172b3a" text-anchor="start" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" xml:space="preserve">    right = B.load((offset, column))</text>
  <text x="470" y="372" font-size="14" font-weight="400" fill="#172b3a" text-anchor="start" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" xml:space="preserve">    acc = dot(left, right, acc)</text>
  <text x="470" y="407" font-size="14" font-weight="400" fill="#172b3a" text-anchor="start" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" xml:space="preserve">C.store((row, column), acc)</text>
  <line x1="406" y1="317" x2="440" y2="317" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="32" y="540" width="896" height="68" rx="12" fill="#f3eff9" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="566" font-size="14" font-weight="650" fill="#7357aa" text-anchor="start">THE COMPILER SELECTS A SUPPORTED HARDWARE LOWERING</text>
  <text x="52" y="591" font-size="14" font-weight="400" fill="#172b3a" text-anchor="start">SIMD-group matrix fragments · Metal 4 cooperative tensors · eligible NAX fragment schedules</text>
  <line x1="32" y1="640" x2="928" y2="640" stroke="#d8e3e9" stroke-width="1.5" />
  <text x="32" y="667" font-size="14" font-weight="400" fill="#536677" text-anchor="start">The logical ownership and K reduction stay the same; precision and layout limits still apply.</text>
</svg>

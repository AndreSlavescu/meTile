<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 800" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">meTile guarded runtime dispatch</title>
  <desc id="description">A clean left-to-right flow diagram of meTile runtime selection. A persistent cache uses a device, source, and shape key. Cache hits bypass tuning through a dedicated upper route. Cache misses compare native MLX with generated meTile candidates, reject incompatible generated results, run eleven provisional rounds and a thirty-one round finalist tournament, and require five or ten percent speedups before switching from native MLX. A separate upper route writes the winner back to the cache. The selected result dispatches through zero-copy MLX or prepared batched Metal execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9Z" fill="#273142"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9Z" fill="#667085"/>
    </marker>
    <style>
      .box { stroke: #273142; stroke-width: 1.5; }
      .inner { fill: #ffffff; stroke: #526071; stroke-width: 1.2; }
      .edge { fill: none; stroke: #273142; stroke-width: 1.55; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .edge-muted { fill: none; stroke: #667085; stroke-width: 1.35; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-muted); }
      .edge-dashed { fill: none; stroke: #667085; stroke-width: 1.35; stroke-dasharray: 6 5; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-muted); }
      .title { fill: #172033; font-size: 25px; font-weight: 700; }
      .subtitle { fill: #556070; font-size: 12px; }
      .label { fill: #172033; font-size: 14px; font-weight: 700; }
      .body { fill: #263243; font-size: 11.5px; }
      .small { fill: #596579; font-size: 10px; }
      .tiny { fill: #596579; font-size: 9px; }
      .caps { fill: #344054; font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px; }
      .mono { fill: #263243; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 9.5px; }
      .arrow-label { fill: #4e596a; font-size: 9.5px; font-style: italic; }
    </style>
  </defs>

  <rect width="1540" height="800" fill="#ffffff"/>

  <!-- Heading -->
  <text x="30" y="42" class="title">meTile guarded runtime dispatch</text>
  <text x="30" y="62" class="subtitle">Cache-first selection with a measured native fallback and low-overhead Apple GPU execution</text>
  <line x1="30" y1="78" x2="1510" y2="78" stroke="#aeb6c2" stroke-width="1"/>

  <!-- Reserved top routing band: the two dashed lanes never intersect -->
  <path d="M210 320H190V92H1520V340H1492" class="edge-dashed"/>
  <rect x="1050" y="99" width="236" height="18" rx="2" fill="#ffffff" stroke="#d0d5dd" stroke-width="0.8"/>
  <text x="1168" y="111.5" text-anchor="middle" class="arrow-label">cache hit · reuse measured winner</text>

  <path d="M1460 517H1500V124H300V303" class="edge-dashed"/>
  <rect x="820" y="132" width="272" height="18" rx="2" fill="#ffffff" stroke="#d0d5dd" stroke-width="0.8"/>
  <text x="956" y="144.5" text-anchor="middle" class="arrow-label">write winner for identical signatures</text>

  <!-- Cache key metadata -->
  <rect x="430" y="165" width="430" height="72" rx="3" fill="#fff4cf" class="box"/>
  <text x="447" y="191" class="caps">PERSISTENT SELECTION KEY</text>
  <text x="447" y="212" class="mono">device / architecture · MLX + Metal toolchain · source digest</text>
  <text x="447" y="230" class="mono">shape + dtype · grid · scale / mask · candidate family</text>

  <!-- One solid primary spine. Every arrow occupies only the gap between panels. -->
  <rect x="30" y="305" width="145" height="70" rx="3" fill="#e7effa" class="box"/>
  <text x="46" y="332" class="label">Operator request</text>
  <text x="46" y="353" class="small">primitive · graph · eDSL</text>
  <path d="M175 340H208" class="edge"/>

  <rect x="210" y="305" width="180" height="70" rx="3" fill="#fff4cf" class="box"/>
  <text x="226" y="331" class="label">Persistent cache</text>
  <text x="226" y="351" class="small">atomic disk + in-process</text>
  <text x="226" y="366" class="tiny">config and measured latency</text>
  <path d="M390 340H428" class="edge"/>
  <rect x="395" y="314" width="30" height="17" rx="2" fill="#ffffff" stroke="#d0d5dd" stroke-width="0.8"/>
  <text x="410" y="326" text-anchor="middle" class="arrow-label">miss</text>

  <rect x="430" y="260" width="240" height="160" rx="3" fill="#f5f3f0" class="box"/>
  <text x="447" y="282" class="caps">CANDIDATES</text>
  <rect x="447" y="294" width="206" height="45" rx="2" fill="#dfeff4" class="inner"/>
  <text x="461" y="313" class="label">Native MLX</text>
  <text x="461" y="330" class="small">framework primitive / exact graph</text>
  <rect x="447" y="351" width="206" height="49" rx="2" fill="#ece5f6" class="inner"/>
  <text x="461" y="371" class="label">Generated meTile</text>
  <text x="461" y="388" class="small">blocks · layouts · fused Metal</text>
  <path d="M670 340H708" class="edge"/>

  <rect x="710" y="300" width="170" height="80" rx="3" fill="#f7e6e9" class="box"/>
  <text x="726" y="324" class="label">Correctness gate</text>
  <text x="726" y="344" class="body">shape · dtype · numerics</text>
  <text x="726" y="363" class="small">reject generated → retain native</text>
  <path d="M880 340H918" class="edge"/>

  <!-- Autotuner loop. Side arrows remain in gutters around the inner panels. -->
  <rect x="920" y="220" width="290" height="240" rx="2" fill="#f4f4f1" class="box"/>
  <text x="938" y="242" class="caps">AUTOTUNER</text>
  <rect x="940" y="258" width="250" height="68" rx="2" class="inner"/>
  <text x="956" y="280" class="label">11 provisional rounds</text>
  <text x="956" y="299" class="body">rotating, reversed round-robin</text>
  <text x="956" y="316" class="small">within 10% + native + fastest generated</text>

  <rect x="940" y="360" width="250" height="68" rx="2" fill="#e8f1e4" class="box"/>
  <text x="956" y="382" class="label">31 finalist rounds</text>
  <text x="956" y="401" class="body">interleaved, synchronized median</text>
  <text x="956" y="418" class="small">wall latency when short · GPU time when sustained</text>

  <path d="M1190 292H1200V394H1192" class="edge"/>
  <path d="M940 394H930V292H938" class="edge-muted"/>
  <rect x="1011" y="333" width="108" height="18" rx="2" fill="#ffffff" stroke="#d0d5dd" stroke-width="0.8"/>
  <text x="1065" y="345.5" text-anchor="middle" class="arrow-label">measure ↔ refine</text>
  <path d="M1210 340H1248" class="edge"/>

  <rect x="1250" y="260" width="240" height="160" rx="3" fill="#e6f1df" class="box"/>
  <text x="1267" y="283" class="caps">GUARDED CHOICE</text>
  <text x="1267" y="309" class="label">5% switch margin</text>
  <text x="1267" y="327" class="small">primitive / discovered attention</text>
  <text x="1267" y="354" class="label">10% switch margin</text>
  <text x="1267" y="372" class="small">graph fusion / quantized MLP</text>
  <line x1="1267" y1="383" x2="1473" y2="383" stroke="#879181" stroke-width="1"/>
  <text x="1267" y="402" class="body">below margin → native MLX fallback</text>

  <!-- Selection persistence and dispatch -->
  <path d="M1370 420V483" class="edge"/>
  <rect x="1280" y="485" width="180" height="65" rx="3" fill="#fff1c8" class="box"/>
  <text x="1296" y="511" class="label">Persist winner</text>
  <text x="1296" y="531" class="small">source / shape / device key</text>

  <path d="M1370 550V598" class="edge"/>
  <circle cx="1370" cy="602" r="4" fill="#273142"/>
  <rect x="1382" y="566" width="112" height="18" rx="2" fill="#ffffff" stroke="#d0d5dd" stroke-width="0.8"/>
  <text x="1438" y="578.5" text-anchor="middle" class="arrow-label">selected integration</text>
  <path d="M1370 606V626H995V648" class="edge"/>
  <path d="M1370 606V648" class="edge"/>

  <rect x="800" y="650" width="390" height="88" rx="3" fill="#e3f2ec" class="box"/>
  <text x="818" y="675" class="caps">MLX BACKEND</text>
  <text x="818" y="701" class="label">Zero-copy MLX graph dispatch</text>
  <text x="818" y="717" class="body">native primitive or lazy <tspan class="mono">mx.fast.metal_kernel</tspan></text>
  <text x="818" y="733" class="tiny">the custom Metal kernel reads the same MLX arrays</text>

  <rect x="1220" y="650" width="270" height="88" rx="3" fill="#e7edf8" class="box"/>
  <text x="1238" y="675" class="caps">NATIVE RUNTIME</text>
  <text x="1238" y="701" class="label">Prepared Metal dispatch</text>
  <text x="1238" y="717" class="body">prebound buffers + pipeline</text>
  <text x="1238" y="733" class="tiny">shared encoder · batching · repeat(count)</text>

  <line x1="30" y1="765" x2="1510" y2="765" stroke="#d0d5dd" stroke-width="1"/>
  <rect x="30" y="778" width="14" height="10" fill="#dfeff4" stroke="#526071" stroke-width="1"/>
  <text x="51" y="787" class="tiny">native</text>
  <rect x="99" y="778" width="14" height="10" fill="#ece5f6" stroke="#526071" stroke-width="1"/>
  <text x="120" y="787" class="tiny">generated</text>
  <rect x="190" y="778" width="14" height="10" fill="#e8f1e4" stroke="#526071" stroke-width="1"/>
  <text x="211" y="787" class="tiny">measured selection</text>
  <text x="1510" y="787" text-anchor="end" class="tiny">solid: runtime spine · dashed: isolated cache routing band</text>
</svg>

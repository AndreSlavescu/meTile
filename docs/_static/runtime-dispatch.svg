<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">meTile guarded runtime dispatch</title>
  <desc id="description">A left-to-right academic flow diagram of meTile runtime selection. A device, source, and shape keyed persistent cache can bypass tuning. Cache misses compare native MLX with generated meTile candidates, reject incompatible generated results, run eleven provisional benchmark rounds and a thirty-one round finalist tournament, and require five or ten percent speedups before switching away from native MLX. The winner is cached and dispatched through zero-copy MLX or prepared batched Metal execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9Z" fill="#273142"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9Z" fill="#667085"/>
    </marker>
    <style>
      .box { stroke: #273142; stroke-width: 1.5; }
      .inner { fill: #ffffff; stroke: #526071; stroke-width: 1.2; }
      .edge { fill: none; stroke: #273142; stroke-width: 1.55; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .edge-muted { fill: none; stroke: #667085; stroke-width: 1.35; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-muted); }
      .edge-dashed { fill: none; stroke: #667085; stroke-width: 1.35; stroke-dasharray: 6 5; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-muted); }
      .title { fill: #172033; font-size: 25px; font-weight: 700; }
      .subtitle { fill: #556070; font-size: 12px; }
      .label { fill: #172033; font-size: 14px; font-weight: 700; }
      .body { fill: #263243; font-size: 11.5px; }
      .small { fill: #596579; font-size: 10px; }
      .tiny { fill: #596579; font-size: 9px; }
      .caps { fill: #344054; font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px; }
      .mono { fill: #263243; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 9.5px; }
      .arrow-label { fill: #4e596a; font-size: 9.5px; font-style: italic; }
    </style>
  </defs>

  <rect width="1500" height="720" fill="#ffffff"/>

  <!-- Heading -->
  <text x="36" y="42" class="title">meTile guarded runtime dispatch</text>
  <text x="36" y="62" class="subtitle">Cache-first selection with a measured native fallback and low-overhead Apple GPU execution</text>
  <line x1="36" y1="78" x2="1464" y2="78" stroke="#aeb6c2" stroke-width="1"/>

  <!-- Selection key -->
  <rect x="205" y="96" width="430" height="72" rx="3" fill="#fff4cf" class="box"/>
  <text x="222" y="123" class="caps">PERSISTENT SELECTION KEY</text>
  <text x="222" y="144" class="mono">device / architecture · MLX + Metal toolchain · source digest</text>
  <text x="222" y="162" class="mono">shape + dtype · grid · scale / mask · candidate family</text>
  <path d="M305 168V219" class="edge-muted"/>

  <!-- Primary flow: request and cache -->
  <rect x="36" y="220" width="145" height="72" rx="3" fill="#e7effa" class="box"/>
  <text x="108.5" y="248" text-anchor="middle" class="label">Operator request</text>
  <text x="108.5" y="268" text-anchor="middle" class="small">primitive · graph · eDSL</text>
  <path d="M181 256H218" class="edge"/>

  <rect x="220" y="220" width="170" height="72" rx="3" fill="#fff4cf" class="box"/>
  <text x="305" y="246" text-anchor="middle" class="label">Persistent cache</text>
  <text x="305" y="266" text-anchor="middle" class="small">atomic disk + in-process</text>
  <text x="305" y="281" text-anchor="middle" class="tiny">config and measured latency</text>

  <!-- Candidate set -->
  <path d="M390 256H432" class="edge"/>
  <text x="410" y="245" text-anchor="middle" class="arrow-label">miss</text>
  <rect x="434" y="175" width="230" height="162" rx="3" fill="#f5f3f0" class="box"/>
  <text x="449" y="196" class="caps">CANDIDATES</text>
  <rect x="451" y="208" width="196" height="48" rx="2" fill="#dfeff4" class="inner"/>
  <text x="465" y="228" class="label">Native MLX</text>
  <text x="465" y="246" class="small">framework primitive / exact graph</text>
  <rect x="451" y="270" width="196" height="49" rx="2" fill="#ece5f6" class="inner"/>
  <text x="465" y="290" class="label">Generated meTile</text>
  <text x="465" y="307" class="small">blocks · layouts · fused Metal</text>

  <!-- Correctness gate -->
  <path d="M664 256H704" class="edge"/>
  <rect x="706" y="211" width="160" height="90" rx="3" fill="#f7e6e9" class="box"/>
  <text x="786" y="235" text-anchor="middle" class="label">Correctness gate</text>
  <text x="786" y="256" text-anchor="middle" class="body">shape + dtype</text>
  <text x="786" y="274" text-anchor="middle" class="body">numerical compatibility</text>
  <text x="786" y="290" text-anchor="middle" class="tiny">reject generated failures</text>
  <path d="M786 301V332H624" class="edge-muted"/>
  <text x="700" y="327" text-anchor="middle" class="arrow-label">native remains safe</text>

  <!-- Autotuner subsystem, inspired by an academic compiler-stack figure -->
  <path d="M866 256H902" class="edge"/>
  <rect x="904" y="143" width="286" height="226" rx="2" fill="#f4f4f1" class="box"/>
  <text x="920" y="164" class="caps">AUTOTUNER</text>

  <rect x="925" y="178" width="244" height="76" rx="2" class="inner"/>
  <text x="942" y="200" class="label">11 provisional rounds</text>
  <text x="942" y="219" class="body">rotating, reversed round-robin</text>
  <text x="942" y="237" class="small">finalists: within 10% + native + fastest generated</text>

  <rect x="925" y="283" width="244" height="63" rx="2" fill="#e8f1e4" class="box"/>
  <text x="942" y="305" class="label">31 finalist rounds</text>
  <text x="942" y="324" class="body">interleaved, synchronized median</text>
  <text x="942" y="339" class="tiny">wall latency for short work · GPU time when sustained</text>

  <path d="M1147 254V281" class="edge"/>
  <rect x="1068" y="258" width="70" height="17" rx="2" fill="#ffffff"/>
  <text x="1103" y="270" text-anchor="middle" class="arrow-label">benchmark</text>
  <path d="M946 283V266H916V196H923" class="edge-muted"/>
  <text x="908" y="244" text-anchor="end" class="arrow-label">feedback</text>

  <!-- Guarded framework choice -->
  <path d="M1190 256H1225" class="edge"/>
  <rect x="1227" y="175" width="237" height="162" rx="3" fill="#e6f1df" class="box"/>
  <text x="1244" y="198" class="caps">GUARDED CHOICE</text>
  <text x="1244" y="224" class="label">5% switch margin</text>
  <text x="1244" y="242" class="small">primitive / discovered attention</text>
  <text x="1244" y="269" class="label">10% switch margin</text>
  <text x="1244" y="287" class="small">graph fusion / quantized MLP</text>
  <line x1="1244" y1="299" x2="1447" y2="299" stroke="#879181" stroke-width="1"/>
  <text x="1244" y="318" class="body">below margin → native MLX fallback</text>

  <!-- Cache-hit bypass and persistence feedback -->
  <path d="M305 220V190H190V90H1345V173" class="edge-dashed"/>
  <text x="1040" y="87" text-anchor="middle" class="arrow-label">cache hit · reuse the measured winner</text>

  <rect x="1247" y="395" width="197" height="65" rx="3" fill="#fff1c8" class="box"/>
  <text x="1345.5" y="421" text-anchor="middle" class="label">Persist winner</text>
  <text x="1345.5" y="441" text-anchor="middle" class="small">source / shape / device key</text>
  <path d="M1345 337V393" class="edge"/>
  <path d="M1247 427H1197V111H635" class="edge-dashed"/>
  <text x="910" y="104" text-anchor="middle" class="arrow-label">write selection for the next identical signature</text>

  <!-- Selected integration -->
  <circle cx="1345" cy="505" r="4" fill="#273142"/>
  <path d="M1345 460V501" class="edge"/>
  <text x="1360" y="487" class="arrow-label">selected integration</text>

  <path d="M1345 509V534H970V558" class="edge"/>
  <path d="M1345 509V558" class="edge"/>

  <rect x="760" y="560" width="420" height="92" rx="3" fill="#e3f2ec" class="box"/>
  <text x="780" y="585" class="caps">MLX BACKEND</text>
  <text x="780" y="611" class="label">Zero-copy MLX graph dispatch</text>
  <text x="780" y="631" class="body">native primitive or lazy <tspan class="mono">mx.fast.metal_kernel</tspan></text>
  <text x="780" y="646" class="small">the custom Metal kernel reads the same MLX arrays</text>

  <rect x="1210" y="560" width="254" height="92" rx="3" fill="#e7edf8" class="box"/>
  <text x="1230" y="585" class="caps">NATIVE RUNTIME</text>
  <text x="1230" y="611" class="label">Prepared Metal dispatch</text>
  <text x="1230" y="631" class="body">prebound buffers + pipeline</text>
  <text x="1230" y="647" class="small">shared encoder · batching · repeat(count)</text>

  <!-- Figure key -->
  <line x1="36" y1="684" x2="1464" y2="684" stroke="#d0d5dd" stroke-width="1"/>
  <rect x="36" y="698" width="14" height="10" fill="#dfeff4" stroke="#526071" stroke-width="1"/>
  <text x="57" y="707" class="tiny">native</text>
  <rect x="105" y="698" width="14" height="10" fill="#ece5f6" stroke="#526071" stroke-width="1"/>
  <text x="126" y="707" class="tiny">generated</text>
  <rect x="196" y="698" width="14" height="10" fill="#e8f1e4" stroke="#526071" stroke-width="1"/>
  <text x="217" y="707" class="tiny">measured selection</text>
  <text x="1464" y="707" text-anchor="end" class="tiny">thin arrows show control flow; dashed arrows show cache reuse</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" role="img" aria-labelledby="title description" font-family="Inter, DejaVu Sans, Arial, sans-serif">
  <title id="title">Choose a measured winner, not a promised one</title>
  <desc id="description">A cache lookup uses device, versions, source, shape, dtype and operation settings. On a miss, generated and native candidates pass numerical gates before interleaved timing. Family-specific switching margins preserve native MLX when no valid improvement is established. The winner is cached and dispatched through MLX or the native runtime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="960" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
  <text x="32" y="46" font-size="27" font-weight="650" fill="#172b3a" text-anchor="start">Choose a measured winner, not a promised one</text>
  <text x="32" y="76" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Measured MLX primitives and model plans use these gates; not every graph region does.</text>
  <line x1="32" y1="100" x2="928" y2="100" stroke="#d8e3e9" stroke-width="1.5" />
  <rect x="32" y="124" width="896" height="96" rx="12" fill="#eef3fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="154" font-size="14" font-weight="650" fill="#3267a8" text-anchor="start">SELECTION KEY</text>
  <text x="52" y="181" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Device + architecture · framework / toolchain versions · source digest</text>
  <text x="52" y="203" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Shape + dtype · grid · operation settings such as scale / mask · candidate family</text>
  <rect x="32" y="258" width="280" height="148" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="287" font-size="14" font-weight="650" fill="#3267a8" text-anchor="start">REQUEST</text>
  <text x="52" y="318" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">An operator or plan</text>
  <text x="52" y="347" font-size="14" font-weight="400" fill="#536677" text-anchor="start">A measured primitive</text>
  <text x="52" y="369" font-size="14" font-weight="400" fill="#536677" text-anchor="start">or a supported model plan.</text>
  <rect x="340" y="258" width="280" height="148" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="360" y="287" font-size="14" font-weight="650" fill="#7357aa" text-anchor="start">LOOK UP</text>
  <text x="360" y="318" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Persistent selection</text>
  <text x="360" y="347" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Atomic disk + in-process cache.</text>
  <text x="360" y="369" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Require a matching signature.</text>
  <rect x="648" y="258" width="280" height="148" rx="12" fill="#e8f5f4" stroke="#d8e3e9" stroke-width="1" />
  <text x="668" y="287" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">CACHE HIT</text>
  <text x="668" y="318" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Reuse the winner</text>
  <text x="668" y="347" font-size="14" font-weight="400" fill="#536677" text-anchor="start">A generated kernel or</text>
  <text x="668" y="369" font-size="14" font-weight="400" fill="#536677" text-anchor="start">the original native operation.</text>
  <line x1="316" y1="332" x2="334" y2="332" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="624" y1="332" x2="642" y2="332" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M480 406V438H172V480" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text x="190" y="464" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Cache miss</text>
  <rect x="32" y="488" width="280" height="234" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="517" font-size="14" font-weight="650" fill="#3267a8" text-anchor="start">COMPARE</text>
  <text x="52" y="548" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Keep native in the race</text>
  <text x="52" y="577" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Native MLX primitive / graph.</text>
  <text x="52" y="599" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Generated meTile candidates:</text>
  <text x="52" y="621" font-size="14" font-weight="400" fill="#536677" text-anchor="start">tiles, schedules, projections,</text>
  <text x="52" y="643" font-size="14" font-weight="400" fill="#536677" text-anchor="start">and supported fusions.</text>
  <rect x="340" y="488" width="280" height="234" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="360" y="517" font-size="14" font-weight="650" fill="#c17134" text-anchor="start">VALIDATE</text>
  <text x="360" y="548" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Check each candidate</text>
  <text x="360" y="577" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Check shape, dtype, numerics.</text>
  <text x="360" y="599" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Check compile / launch status.</text>
  <text x="360" y="621" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Failed generated candidates</text>
  <text x="360" y="643" font-size="14" font-weight="400" fill="#536677" text-anchor="start">keep the native path available.</text>
  <rect x="648" y="488" width="280" height="234" rx="12" fill="#f5f8fb" stroke="#d8e3e9" stroke-width="1" />
  <text x="668" y="517" font-size="14" font-weight="650" fill="#7357aa" text-anchor="start">MEASURE</text>
  <text x="668" y="548" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">Interleave and refine</text>
  <text x="668" y="577" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Example model-plan search:</text>
  <text x="668" y="599" font-size="14" font-weight="400" fill="#536677" text-anchor="start">3 provisional rounds;</text>
  <text x="668" y="621" font-size="14" font-weight="400" fill="#536677" text-anchor="start">7 finalist pairs; rotate order.</text>
  <text x="668" y="643" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Family-specific margins.</text>
  <text x="668" y="665" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Audit model fidelity</text>
  <text x="668" y="687" font-size="14" font-weight="400" fill="#536677" text-anchor="start">separately.</text>
  <line x1="316" y1="604" x2="334" y2="604" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="624" y1="604" x2="642" y2="604" stroke="#536677" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M788 722V746H480V778" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M928 332H946V752H724V778" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5" />
  <rect x="32" y="786" width="896" height="98" rx="12" fill="#e8f5f4" stroke="#d8e3e9" stroke-width="1" />
  <text x="52" y="818" font-size="14" font-weight="650" fill="#087f8c" text-anchor="start">PERSIST + DISPATCH</text>
  <text x="52" y="847" font-size="14" font-weight="400" fill="#172b3a" text-anchor="start">MLX: native primitive or lazy custom Metal kernel sharing the existing arrays.</text>
  <text x="52" y="870" font-size="14" font-weight="400" fill="#172b3a" text-anchor="start">Native runtime: prepared buffers / pipeline, shared encoders, batching, and repeats.</text>
  <line x1="32" y1="912" x2="928" y2="912" stroke="#d8e3e9" stroke-width="1.5" />
  <text x="32" y="939" font-size="14" font-weight="400" fill="#536677" text-anchor="start">A native fallback is not a generated-kernel speedup. Search settings and margins vary by family.</text>
</svg>

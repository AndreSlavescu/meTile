<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title description">
  <title id="title">GEMM tiling and the K reduction loop</title>
  <desc id="description">Matrices A and B are partitioned into BM by BK and BK by BN tiles. One program instance accumulates a BM by BN output tile across the K dimension, keeps the accumulator in registers, and stores the completed tile once.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L8 5L0 9Z" fill="#303842"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20242b; }
      .heading { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #505866; }
      .stage { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #505866; }
      .panel-title { font-size: 17px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 700; }
      .body { font-size: 12px; fill: #4b5563; }
      .small { font-size: 10.5px; fill: #4b5563; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11px; }
      .math { font-size: 24px; font-weight: 700; }
      .panel { stroke: #282d35; stroke-width: 1.4; }
      .grid { stroke: #6a7584; stroke-width: 1; }
      .edge { fill: none; stroke: #303842; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="840" fill="#ffffff"/>
  <text x="40" y="48" class="heading">GEMM tiling: C = A × B</text>
  <text x="40" y="70" class="subtitle">One program owns one output tile and reduces matching A and B tiles across K.</text>
  <line x1="40" y1="88" x2="1160" y2="88" stroke="#b4bcc7" stroke-width="1"/>

  <text x="40" y="112" class="stage">MATRIX PARTITIONING</text>

  <g id="matrix-a">
    <rect x="40" y="126" width="300" height="240" rx="4" fill="#e7f0fa" class="panel"/>
    <text x="58" y="154" class="panel-title">A</text>
    <text x="58" y="176" class="body">shape M × K</text>
    <rect x="70" y="194" width="240" height="140" fill="#ffffff" class="panel"/>
    <path d="M130 194V334M190 194V334M250 194V334M70 241H310M70 288H310" class="grid" fill="none"/>
    <rect x="70" y="194" width="120" height="47" fill="#bcd9f0" class="panel"/>
    <text x="82" y="216" class="label">A tile</text>
    <text x="82" y="233" class="small">BM × BK</text>
    <text x="58" y="352" class="mono">rows = pid_m · BM</text>
  </g>

  <text x="390" y="254" text-anchor="middle" class="math">×</text>

  <g id="matrix-b">
    <rect x="440" y="126" width="300" height="240" rx="4" fill="#eee6f6" class="panel"/>
    <text x="458" y="154" class="panel-title">B</text>
    <text x="458" y="176" class="body">shape K × N</text>
    <rect x="470" y="194" width="240" height="140" fill="#ffffff" class="panel"/>
    <path d="M530 194V334M590 194V334M650 194V334M470 241H710M470 288H710" class="grid" fill="none"/>
    <rect x="470" y="194" width="60" height="94" fill="#d8c9e9" class="panel"/>
    <text x="500" y="226" text-anchor="middle" class="label">B tile</text>
    <text x="500" y="245" text-anchor="middle" class="small">BK</text>
    <text x="500" y="261" text-anchor="middle" class="small">×</text>
    <text x="500" y="277" text-anchor="middle" class="small">BN</text>
    <text x="458" y="352" class="mono">cols = pid_n · BN</text>
  </g>

  <path d="M770 246H816" class="edge"/>

  <g id="matrix-c">
    <rect x="840" y="126" width="320" height="240" rx="4" fill="#e5f1e2" class="panel"/>
    <text x="858" y="154" class="panel-title">C</text>
    <text x="858" y="176" class="body">shape M × N · program grid = ceil(M/BM) × ceil(N/BN)</text>
    <rect x="870" y="194" width="260" height="140" fill="#ffffff" class="panel"/>
    <path d="M935 194V334M1000 194V334M1065 194V334M870 229H1130M870 264H1130M870 299H1130" class="grid" fill="none"/>
    <rect x="870" y="194" width="65" height="35" fill="#c9e5c7" class="panel"/>
    <text x="902.5" y="216" text-anchor="middle" class="small">pid 0,0</text>
    <text x="858" y="352" class="mono">one program → one BM × BN tile</text>
  </g>

  <text x="40" y="404" class="stage">INSIDE ONE PROGRAM: K REDUCTION</text>
  <rect x="40" y="420" width="1120" height="258" rx="4" fill="#f7efc8" class="panel"/>

  <g id="iteration-zero">
    <rect x="66" y="452" width="310" height="180" rx="3" fill="#ffffff" class="panel"/>
    <text x="84" y="480" class="panel-title">Iteration k = 0</text>
    <rect x="84" y="502" width="88" height="48" rx="2" fill="#dcecf8" class="panel"/>
    <text x="128" y="522" text-anchor="middle" class="label">A tile</text>
    <text x="128" y="540" text-anchor="middle" class="small">BM × BK</text>
    <text x="191" y="533" text-anchor="middle" class="math">×</text>
    <rect x="210" y="502" width="88" height="48" rx="2" fill="#e7e0f2" class="panel"/>
    <text x="254" y="522" text-anchor="middle" class="label">B tile</text>
    <text x="254" y="540" text-anchor="middle" class="small">BK × BN</text>
    <text x="84" y="579" class="mono">acc = dot(a, b, zeros)</text>
    <text x="84" y="606" class="body">BM × BN accumulator stays in registers</text>
  </g>

  <path d="M376 542H420" class="edge"/>

  <g id="iteration-next">
    <rect x="422" y="452" width="310" height="180" rx="3" fill="#ffffff" class="panel"/>
    <text x="440" y="480" class="panel-title">Iteration k = BK</text>
    <rect x="440" y="502" width="88" height="48" rx="2" fill="#dcecf8" class="panel"/>
    <text x="484" y="522" text-anchor="middle" class="label">next A</text>
    <text x="484" y="540" text-anchor="middle" class="small">BM × BK</text>
    <text x="547" y="533" text-anchor="middle" class="math">×</text>
    <rect x="566" y="502" width="88" height="48" rx="2" fill="#e7e0f2" class="panel"/>
    <text x="610" y="522" text-anchor="middle" class="label">next B</text>
    <text x="610" y="540" text-anchor="middle" class="small">BK × BN</text>
    <text x="440" y="579" class="mono">acc = dot(a, b, acc)</text>
    <text x="440" y="606" class="body">The same register tile accumulates again</text>
  </g>

  <path d="M732 542H776" class="edge"/>

  <g id="remaining-iterations">
    <rect x="778" y="452" width="356" height="180" rx="3" fill="#ffffff" class="panel"/>
    <text x="796" y="480" class="panel-title">Repeat to K</text>
    <text x="796" y="511" class="mono">for k in tile_range(0, K, BK)</text>
    <text x="796" y="541" class="body">Load matching A and B tiles.</text>
    <text x="796" y="565" class="body">Apply the selected hardware MMA.</text>
    <text x="796" y="589" class="body">Optionally fuse the register epilogue.</text>
    <rect x="992" y="503" width="118" height="72" rx="3" fill="#e5f1e2" class="panel"/>
    <text x="1051" y="530" text-anchor="middle" class="label">acc</text>
    <text x="1051" y="551" text-anchor="middle" class="small">BM × BN</text>
    <text x="1051" y="567" text-anchor="middle" class="small">registers</text>
  </g>

  <path d="M956 632V706" class="edge"/>

  <rect x="40" y="708" width="1120" height="92" rx="4" fill="#e5f1e2" class="panel"/>
  <text x="60" y="739" class="panel-title">Store the completed output tile once</text>
  <text x="60" y="766" class="mono">metile.tile_store(C, pid_m · BM, pid_n · BN, N, acc, (BM, BN))</text>
  <text x="1140" y="753" text-anchor="end" class="body">No score matrix or intermediate GEMM tile is materialized.</text>
  <text x="1140" y="776" text-anchor="end" class="body">Fused epilogues run before this global-memory write.</text>
</svg>

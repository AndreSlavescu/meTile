<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title description" font-family="Inter, DejaVu Sans, Arial, sans-serif">
  <title id="title">Sixteen SIMD-groups share one output tile</title>
  <desc id="description">A four by four SIMD-group grid partitions a 128 by 128 output tile into sixteen 32 by 32 subtiles. Each SIMD-group has 32 threads. The row and column indices are sgid divided by WN and sgid modulo WN. Hardware and pipeline limits still apply.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#536677" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="680" rx="0" fill="#ffffff" stroke="none" stroke-width="1" />
  <text x="32" y="46" font-size="27" font-weight="650" fill="#172b3a" text-anchor="start">Sixteen SIMD-groups share one output tile</text>
  <text x="32" y="76" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Example tensor-ops geometry: WM = 4, WN = 4, and a 128 × 128 program-owned tile.</text>
  <line x1="32" y1="100" x2="928" y2="100" stroke="#d8e3e9" stroke-width="1.5" />
  <text x="335" y="143" font-size="14" font-weight="650" fill="#536677" text-anchor="middle">OUTPUT COLUMNS</text>
  <text x="144" y="176" font-size="14" font-weight="400" fill="#536677" text-anchor="middle">0–31</text>
  <text x="270" y="176" font-size="14" font-weight="400" fill="#536677" text-anchor="middle">32–63</text>
  <text x="396" y="176" font-size="14" font-weight="400" fill="#536677" text-anchor="middle">64–95</text>
  <text x="522" y="176" font-size="14" font-weight="400" fill="#536677" text-anchor="middle">96–127</text>
  <text x="73" y="235" font-size="14" font-weight="400" fill="#536677" text-anchor="end">0–31</text>
  <rect x="88" y="197" width="116" height="68" rx="7" fill="#087f8c" stroke="none" stroke-width="1" />
  <text x="146" y="226" font-size="15" font-weight="650" fill="#ffffff" text-anchor="middle">sg(0,0)</text>
  <text x="146" y="249" font-size="14" font-weight="400" fill="#ffffff" text-anchor="middle">32 × 32</text>
  <rect x="214" y="197" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="272" y="226" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(0,1)</text>
  <text x="272" y="249" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="340" y="197" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="398" y="226" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(0,2)</text>
  <text x="398" y="249" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="466" y="197" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="524" y="226" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(0,3)</text>
  <text x="524" y="249" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <text x="73" y="313" font-size="14" font-weight="400" fill="#536677" text-anchor="end">32–63</text>
  <rect x="88" y="275" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="146" y="304" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(1,0)</text>
  <text x="146" y="327" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="214" y="275" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="272" y="304" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(1,1)</text>
  <text x="272" y="327" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="340" y="275" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="398" y="304" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(1,2)</text>
  <text x="398" y="327" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="466" y="275" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="524" y="304" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(1,3)</text>
  <text x="524" y="327" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <text x="73" y="391" font-size="14" font-weight="400" fill="#536677" text-anchor="end">64–95</text>
  <rect x="88" y="353" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="146" y="382" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(2,0)</text>
  <text x="146" y="405" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="214" y="353" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="272" y="382" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(2,1)</text>
  <text x="272" y="405" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="340" y="353" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="398" y="382" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(2,2)</text>
  <text x="398" y="405" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="466" y="353" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="524" y="382" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(2,3)</text>
  <text x="524" y="405" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <text x="73" y="469" font-size="14" font-weight="400" fill="#536677" text-anchor="end">96–127</text>
  <rect x="88" y="431" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="146" y="460" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(3,0)</text>
  <text x="146" y="483" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="214" y="431" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="272" y="460" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(3,1)</text>
  <text x="272" y="483" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="340" y="431" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="398" y="460" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(3,2)</text>
  <text x="398" y="483" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="466" y="431" width="116" height="68" rx="7" fill="#e8f5f4" stroke="none" stroke-width="1" />
  <text x="524" y="460" font-size="15" font-weight="650" fill="#087f8c" text-anchor="middle">sg(3,3)</text>
  <text x="524" y="483" font-size="14" font-weight="400" fill="#087f8c" text-anchor="middle">32 × 32</text>
  <rect x="638" y="148" width="290" height="364" rx="12" fill="#f3eff9" stroke="#d8e3e9" stroke-width="1" />
  <text x="658" y="177" font-size="14" font-weight="650" fill="#7357aa" text-anchor="start">HARDWARE MAPPING</text>
  <text x="658" y="208" font-size="19" font-weight="650" fill="#172b3a" text-anchor="start">32 threads per group</text>
  <text x="658" y="237" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Each SIMD-group owns one</text>
  <text x="658" y="259" font-size="14" font-weight="400" fill="#536677" text-anchor="start">32 × 32 output subtile.</text>
  <text x="658" y="281" font-size="14" font-weight="400" fill="#536677" text-anchor="start">sg_row = sgid // WN</text>
  <text x="658" y="303" font-size="14" font-weight="400" fill="#536677" text-anchor="start">sg_col = sgid % WN</text>
  <text x="658" y="325" font-size="14" font-weight="400" fill="#536677" text-anchor="start">16 groups × 32 threads</text>
  <text x="658" y="347" font-size="14" font-weight="400" fill="#536677" text-anchor="start">= 512 threads in this example.</text>
  <text x="88" y="548" font-size="14" font-weight="400" fill="#536677" text-anchor="start">Output rows are shown at left. The highlighted subtile belongs to sg(0,0).</text>
  <line x1="32" y1="612" x2="928" y2="612" stroke="#d8e3e9" stroke-width="1.5" />
  <text x="32" y="639" font-size="14" font-weight="400" fill="#536677" text-anchor="start">This is one supported geometry, not a universal launch configuration.</text>
  <text x="32" y="661" font-size="14" font-weight="400" fill="#536677" text-anchor="start">The planner and runtime must check device capabilities, fragment shapes, and pipeline thread limits.</text>
</svg>
